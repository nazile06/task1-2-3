server:
  port: 8082

spring:
  application:
    name: storage-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/storagedb}
    username: ${SPRING_DATASOURCE_USERNAME:storage}
    password: ${SPRING_DATASOURCE_PASSWORD:storage}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health
