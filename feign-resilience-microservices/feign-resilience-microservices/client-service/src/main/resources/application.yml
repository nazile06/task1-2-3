server:
  port: 8081

spring:
  application:
    name: client-service
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 2000

storage:
  service:
    url: ${STORAGE_SERVICE_URL:http://localhost:8082}

# Resilience4j: Retry (outer) wraps CircuitBreaker (inner), both named "storage".
resilience4j:
  retry:
    instances:
      storage:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        # Only transient problems are retried: 5xx responses and connection/timeout failures.
        retry-exceptions:
          - com.example.client.exception.DownstreamServerException
          - feign.RetryableException
        # 4xx responses are the caller's fault, retrying cannot fix them.
        ignore-exceptions:
          - com.example.client.exception.DownstreamClientException
  circuitbreaker:
    instances:
      storage:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        # 4xx responses are neither successes nor failures for the breaker.
        ignore-exceptions:
          - com.example.client.exception.DownstreamClientException

management:
  endpoints:
    web:
      exposure:
        include: health,circuitbreakers,circuitbreakerevents,retries,retryevents
  health:
    circuitbreakers:
      enabled: true
